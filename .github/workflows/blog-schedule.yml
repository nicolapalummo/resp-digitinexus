name: Pubblicazione automatica blog

# Ogni mattina aggiorna un file timestamp e fa un commit su main: il push
# fa ripartire automaticamente il deploy di produzione su Vercel (integrazione
# Git). Al rebuild, gli articoli del blog con publishDate raggiunta diventano
# visibili (il filtro è build-time, in scripts/prerender-blog.mjs); i post con
# data futura restano nascosti.
#
# Nessun secret da configurare: usa il GITHUB_TOKEN integrato per il push.

on:
  schedule:
    - cron: '0 5 * * *' # ogni giorno alle 05:00 UTC (~07:00 Italia)
  workflow_dispatch: {} # esecuzione manuale dal tab Actions

permissions:
  contents: write # serve per il push del commit giornaliero

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit giornaliero → trigger deploy Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-publish
          git add .last-publish
          git commit -m "chore: rebuild giornaliero blog ($(date -u +%Y-%m-%d))"
          git push
          echo "Commit pushato: Vercel ribuilderà la produzione."
