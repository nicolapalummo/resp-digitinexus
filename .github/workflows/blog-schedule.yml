name: Pubblicazione automatica blog

# Ribuilda e ridistribuisce il sito ogni giorno: gli articoli del blog con
# publishDate raggiunta diventano visibili (il filtro è build-time, in
# scripts/prerender-blog.mjs). I post con data futura restano nascosti.
#
# Richiede UN secret di repository (NON committarlo):
#   VERCEL_DEPLOY_HOOK_URL  → URL del Deploy Hook di Vercel
#   (Vercel → Project → Settings → Git → Deploy Hooks → crea hook sul branch di produzione)
#
# Calendario editoriale: 2 post/settimana, lunedì e giovedì. Il cron gira ogni
# mattina così ogni post va online il giorno della sua publishDate.

on:
  schedule:
    - cron: '0 5 * * *' # ogni giorno alle 05:00 UTC (~07:00 Italia)
  workflow_dispatch: {} # esecuzione manuale dal tab Actions

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL non configurato. Impostalo in Settings → Secrets → Actions."
            exit 1
          fi
          echo "Trigger del rebuild di produzione su Vercel…"
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Deploy avviato."
